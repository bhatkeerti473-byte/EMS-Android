// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.6.0'
        classpath 'com.google.gms:google-services:4.4.0'
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

subprojects {
    project.configurations.all {
        resolutionStrategy.eachDependency { details ->
            // 1. Resolve duplicate Kotlin stdlib classes
            if (details.requested.group == 'org.jetbrains.kotlin') {
                if (details.requested.name in ['kotlin-stdlib-jdk7', 'kotlin-stdlib-jdk8']) {
                    details.useTarget("org.jetbrains.kotlin:kotlin-stdlib:1.8.22")
                }
            }
            // 2. Lock AndroidX libraries so AGP 8.6.0 is satisfied
            if (details.requested.group == 'androidx.core') {
                details.useVersion '1.13.1'
            }
            if (details.requested.group == 'androidx.activity') {
                details.useVersion '1.9.3'
            }
            if (details.requested.group == 'androidx.webkit') {
                details.useVersion '1.12.1'
            }
            if (details.requested.name == 'core-splashscreen') {
                details.useVersion '1.0.1'
            }
        }
    }
}